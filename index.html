<script>
const input = document.querySelector("textarea");
const checkButton = document.getElementById("check");
const result = document.getElementById("result");

checkButton.onclick = async () => {
  const text = input.value.trim();

  if (!text) {
    result.innerHTML = "<strong>Please enter a message, email or website link to check.</strong>";
    return;
  }

  checkButton.disabled = true;
  checkButton.textContent = "Checking...";

  try {
    const response = await fetch("/api/check", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unable to check this content.");
    }

    const reasons = data.reasons.length
      ? "<ul>" + data.reasons.map(reason => `<li>${reason}</li>`).join("") + "</ul>"
      : "<p>No obvious warning signs detected.</p>";

    result.innerHTML = `
      <h3>Risk level: ${data.riskLevel}</h3>
      ${reasons}
      <p>${data.message}</p>
    `;
  } catch (error) {
    result.innerHTML = `
      <strong>We couldn't complete the check.</strong>
      <p>Please try again.</p>
    `;
  } finally {
    checkButton.disabled = false;
    checkButton.textContent = "Check for Scam";
  }
};
</script>
</body></html>
